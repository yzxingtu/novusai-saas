services:
  # PostgreSQL 数据库
  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    container_name: novusai-postgres-dev
    environment:
      POSTGRES_DB: novusai_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novusai-dev

  # Redis 缓存/消息队列
  redis:
    image: redis:7-alpine
    container_name: novusai-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - novusai-dev

  # Prometheus 本地监控 / Local Prometheus monitoring
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: novusai-prometheus-dev
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - novusai-dev

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local

networks:
  novusai-dev:
    driver: bridge
