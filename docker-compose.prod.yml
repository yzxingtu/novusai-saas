name: novusai-prod

x-app-env: &app-env
  env_file:
    - ${NOVUSAI_PROD_ENV_FILE:-./production.env}

x-backend-env: &backend-env
  <<: *app-env
  environment:
    APP_ENV: production
    DEBUG: "false"
    RUN_MIGRATIONS_ON_STARTUP: "false"
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    APP_INTERNAL_BASE_URL: http://backend-api:8000
  volumes:
    - backend_storage:/app/storage
    - backend_logs:/app/logs

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg14
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-novusai_saas}
      POSTGRES_USER: ${DATABASE_USER:-novusai}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-novusai_change_me}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - novusai-prod

  redis-init:
    image: redis:7-alpine
    restart: "no"
    user: "0:0"
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp
    command:
      - sh
      - -ec
      - chown -R 999:999 /data
    volumes:
      - redis_data:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    user: "999:999"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-novusai_change_me}
    command:
      - sh
      - -c
      - |
        set -eu
        umask 077
        printf 'appendonly yes\nrequirepass %s\n' "$${REDIS_PASSWORD}" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      redis-init:
        condition: service_completed_successfully
    networks:
      - novusai-prod

  backend-migrate:
    <<: *backend-env
    image: novusai/backend:${NOVUSAI_IMAGE_TAG:-latest}
    command: ["novusai", "db", "upgrade", "heads"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - novusai-prod

  backend-api:
    <<: *backend-env
    image: novusai/backend:${NOVUSAI_IMAGE_TAG:-latest}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-18000}:8000"
    restart: unless-stopped
    networks:
      - novusai-prod

  backend-worker:
    <<: *backend-env
    image: novusai/backend-worker:${NOVUSAI_IMAGE_TAG:-latest}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A app.celery_app:celery_app inspect ping -d celery@\"$${HOSTNAME}\" --timeout=5 | grep -q OK"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    networks:
      - novusai-prod

  backend-beat:
    <<: *backend-env
    image: novusai/backend-beat:${NOVUSAI_IMAGE_TAG:-latest}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -w /app/var/celerybeat && test -f /app/var/celerybeat/celerybeat-schedule && novusai check celery",
        ]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    volumes:
      - backend_storage:/app/storage
      - backend_logs:/app/logs
      - backend_beat_state:/app/var/celerybeat
    restart: unless-stopped
    networks:
      - novusai-prod

  frontend:
    image: novusai/frontend-web-antd:${NOVUSAI_IMAGE_TAG:-latest}
    depends_on:
      backend-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HTTP_PORT:-18080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - novusai-prod

volumes:
  backend_storage:
  backend_beat_state:
  backend_logs:
  postgres_data:
  redis_data:

networks:
  novusai-prod:
    driver: bridge
