# Alembic Configuration

[alembic]
# Migration script location
script_location = migrations

# Migration file naming template
# file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone
timezone = UTC

# Truncate long slug
# truncate_slug_length = 40

# Version locations (main + installed plugins)
# NOTE: When adding a new plugin with migrations, append its path here
version_locations = migrations/versions plugins/novusdoc/backend/migrations/versions plugins/novusdoc-pro/backend/migrations/versions plugins/storage-migration/backend/migrations/versions

# Output encoding
output_encoding = utf-8

# Database URL (overridden by code)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/novusai_saas


[post_write_hooks]
# Auto-format after generating migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
