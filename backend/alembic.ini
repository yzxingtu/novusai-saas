# Alembic Configuration

[alembic]
# Migration script location
script_location = %(here)s/migrations

# Migration file naming template (YYYYMMDD_HHMM_descriptive_name)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# Timezone
timezone = UTC

# Truncate long slug
# truncate_slug_length = 40

# Version locations
# Keep repo-bundled plugin migration branches here so raw `alembic current/history/heads`
# can resolve revisions already stamped in alembic_version.
# Runtime helpers still append extra plugin paths dynamically and must dedupe.
path_separator = newline
version_locations =
    %(here)s/migrations/versions
    %(here)s/plugins/novusdoc/backend/migrations/versions
    %(here)s/plugins/storage-migration/backend/migrations/versions

# Output encoding
output_encoding = utf-8

# Database URL (overridden by code)
sqlalchemy.url = postgresql://postgres:postgres@localhost:5432/novusai_saas


[post_write_hooks]
# Auto-format after generating migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
