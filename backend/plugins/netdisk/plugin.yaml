name: netdisk
version: "1.0.0"
display_name:
  zh-CN: "企业网盘"
  en: "Enterprise NetDisk"
description:
  zh-CN: "企业私有化网盘，支持多级文件夹管理、分片上传、分享链接、存储配额及 AI 文件查询技能。"
  en: "Enterprise cloud disk with folder management, chunked upload, sharing, quotas and AI search."
author: "NovusAI"
icon: "lucide:hard-drive"
scope: admin_and_assigned

capabilities:
  - storage:read
  - storage:write
  - http:outbound
  - db:own_tables

dependencies:
  python:
    - "aiofiles>=23.0"
    - "bcrypt>=4.0"
    - "Pillow>=10.0"

pricing:
  type: free

config_schema:
  type: object
  required: []
  properties:
    default_quota_gb:
      type: integer
      default: 10
      minimum: 1
      maximum: 10240
      title: "默认配额 (GB)"
      description: "新租户默认存储配额（单位 GB）"
    max_file_size_mb:
      type: integer
      default: 5120
      minimum: 1
      maximum: 102400
      title: "单文件上限 (MB)"
    allowed_extensions:
      type: array
      items:
        type: string
      default: []
      title: "允许扩展名（空=不限）"
    share_link_max_days:
      type: integer
      default: 30
      minimum: 1
      maximum: 365
      title: "分享链接最长有效天数"
    recycle_bin_days:
      type: integer
      default: 30
      minimum: 1
      maximum: 365
      title: "回收站保留天数"
    preview_enabled:
      type: boolean
      default: true
      title: "启用文件预览"

extensions:
  tasks:
    - name: netdisk-cleanup
      handler: "tasks.cleanup.netdisk_cleanup"
      schedule_type: cron
      cron_expression: "0 2 * * *"
      queue: scheduled
      description: "回收站物理清理 + 租户配额重算"

  skills:
    - name: netdisk-tools
      type: toolkit
      display_name:
        zh-CN: "网盘文件查询"
        en: "NetDisk File Tools"
      entry_point: "skills.netdisk_resolver"

  api:
    tenant_routes:
      # ── 文件节点
      - { method: GET,    path: "nodes",                       handler: "api.tenant_files.list_nodes" }
      - { method: GET,    path: "nodes/{node_id}",            handler: "api.tenant_files.get_node" }
      - { method: POST,   path: "nodes/folder",               handler: "api.tenant_files.create_folder" }
      - { method: PATCH,  path: "nodes/{node_id}",            handler: "api.tenant_files.rename_node" }
      - { method: POST,   path: "nodes/{node_id}/move",       handler: "api.tenant_files.move_node" }
      - { method: POST,   path: "nodes/{node_id}/copy",       handler: "api.tenant_files.copy_node" }
      - { method: DELETE, path: "nodes/{node_id}",            handler: "api.tenant_files.delete_node" }
      - { method: POST,   path: "batch",                      handler: "api.tenant_files.batch_op" }
      - { method: GET,    path: "search",                     handler: "api.tenant_files.search_files" }
      # ── 回收站
      - { method: GET,    path: "trash",                      handler: "api.tenant_files.list_trash" }
      - { method: POST,   path: "trash/{node_id}/restore",    handler: "api.tenant_files.restore_node" }
      - { method: DELETE, path: "trash",                      handler: "api.tenant_files.clear_trash" }
      # ── 上传
      - { method: POST,   path: "upload",                     handler: "api.tenant_upload.upload_whole" }
      - { method: POST,   path: "upload/init",                handler: "api.tenant_upload.upload_init" }
      - { method: POST,   path: "upload/part",                handler: "api.tenant_upload.upload_part" }
      - { method: POST,   path: "upload/complete",            handler: "api.tenant_upload.upload_complete" }
      - { method: GET,    path: "upload/status/{upload_id}",  handler: "api.tenant_upload.upload_status" }
      - { method: GET,    path: "nodes/{node_id}/download",   handler: "api.tenant_upload.download_node" }
      - { method: GET,    path: "nodes/{node_id}/thumbnail",  handler: "api.tenant_upload.get_thumbnail" }
      # ── 分享
      - { method: POST,   path: "nodes/{node_id}/share",      handler: "api.tenant_shares.create_share" }
      - { method: GET,    path: "nodes/{node_id}/shares",     handler: "api.tenant_shares.list_node_shares" }
      - { method: GET,    path: "shares",                     handler: "api.tenant_shares.list_my_shares" }
      - { method: DELETE, path: "shares/{token}",             handler: "api.tenant_shares.cancel_share" }
      # ── 配额
      - { method: GET,    path: "quota",                      handler: "api.tenant_shares.get_quota" }

    public_routes:
      - { method: GET,    path: "shares/{token}",                  handler: "api.public_shares.access_share",          auth: "none" }
      - { method: POST,   path: "shares/{token}/verify",           handler: "api.public_shares.verify_share_password", auth: "none" }
      - { method: GET,    path: "shares/{token}/download/{node_id}", handler: "api.public_shares.download_share_file", auth: "none" }

    admin_routes:
      - { method: GET,    path: "admin/files",                          handler: "api.admin.list_tenant_files" }
      - { method: GET,    path: "admin/quotas",                         handler: "api.admin.list_quotas" }
      - { method: PATCH,  path: "admin/quotas/{tenant_id}",             handler: "api.admin.update_quota" }
      - { method: POST,   path: "admin/quotas/recalculate/{tenant_id}", handler: "api.admin.recalculate_quota" }
      - { method: GET,    path: "admin/shares",                         handler: "api.admin.list_all_shares" }
      - { method: DELETE, path: "admin/shares/{token}",                 handler: "api.admin.revoke_share" }
      - { method: GET,    path: "admin/stats",                          handler: "api.admin.get_stats" }

  frontend:
    standalone_pages:
      - name: netdisk-tenant
        path: /tenant/plugins/netdisk
        component: "NetDiskPage"
        icon: "lucide:hard-drive"
        title:
          zh-CN: "企业网盘"
          en: "NetDisk"
      - name: netdisk-admin
        path: /admin/plugins/netdisk
        component: "NetDiskAdminPage"
        icon: "lucide:hard-drive"
        title:
          zh-CN: "网盘管理"
          en: "NetDisk Admin"
    header_widgets:
      - name: netdisk-nav-icon
        component: "NetdiskWidget"
        slot: "headerNavRight"
        scope: "tenant"
        order: 10
