name: storage-migration
version: "1.0.0"
display_name:
  zh-CN: "存储迁移工具"
  en: "Storage Migration Tool"
description:
  zh-CN: "跨存储驱动文件迁移工具，支持 local / aliyun-oss / amazon-s3 / tencent-cos / qiniu-kodo 之间的双向迁移，包含影响分析、批量同步、断点续传和回滚机制"
  en: "Cross-driver storage migration tool supporting bidirectional migration between local / aliyun-oss / amazon-s3 / tencent-cos / qiniu-kodo, with impact analysis, batch sync, resume capability and rollback"
author: "NovusAI"
icon: ""
icon_color: "#3b82f6"
scope: admin_only
tags: ["storage", "migration", "admin", "tools"]

capabilities:
  - db:own_tables
  - platform:read
  - storage:read
  - storage:write

db_table_prefixes:
  - px_storage_migration_

extensions:
  permissions:
    - code: storage_migration
      name:
        zh-CN: "存储迁移任务"
        en: "Storage Migration Task"
      scope: admin
      actions:
        - view
        - analyze
        - create
        - pause
        - resume
        - cancel
        - retry
        - rollback
        - cleanup

  api:
    admin_routes:
      - method: GET
        path: impact-analysis
        handler: "api.handlers.get_impact_analysis"
        summary: "Get impact analysis before storage switch"
        auth: required
        permission: "storage_migration:analyze"
      - method: POST
        path: tasks
        handler: "api.handlers.create_migration_task"
        summary: "Create a new migration task"
        auth: required
        permission: "storage_migration:create"
      - method: GET
        path: tasks
        handler: "api.handlers.list_migration_tasks"
        summary: "List migration tasks"
        auth: required
        permission: "storage_migration:view"
      - method: GET
        path: "tasks/{task_id}"
        handler: "api.handlers.get_migration_task"
        summary: "Get migration task detail"
        auth: required
        permission: "storage_migration:view"
      - method: POST
        path: "tasks/{task_id}/pause"
        handler: "api.handlers.pause_migration_task"
        summary: "Pause a running migration task"
        auth: required
        permission: "storage_migration:pause"
      - method: POST
        path: "tasks/{task_id}/resume"
        handler: "api.handlers.resume_migration_task"
        summary: "Resume a paused migration task"
        auth: required
        permission: "storage_migration:resume"
      - method: POST
        path: "tasks/{task_id}/cancel"
        handler: "api.handlers.cancel_migration_task"
        summary: "Cancel a migration task"
        auth: required
        permission: "storage_migration:cancel"
      - method: POST
        path: "tasks/{task_id}/retry-failed"
        handler: "api.handlers.retry_failed_files"
        summary: "Retry failed files in a migration task"
        auth: required
        permission: "storage_migration:retry"
      - method: POST
        path: "tasks/{task_id}/rollback"
        handler: "api.handlers.rollback_migration_task"
        summary: "Rollback a completed migration task"
        auth: required
        permission: "storage_migration:rollback"
      - method: DELETE
        path: "tasks/{task_id}/source-files"
        handler: "api.handlers.cleanup_source_files"
        summary: "Delete source files after successful migration"
        auth: required
        permission: "storage_migration:cleanup"
    tenant_routes: []
    public_routes: []

  frontend:
    pages:
      - name: storage_migration_page
        path: /admin/plugins/storage-migration
        component: StorageMigrationPage
        scope: admin
        icon: "lucide:hard-drive-download"
        title:
          zh-CN: "存储迁移"
          en: "Storage Migration"
        access_codes:
          - "plugin.storage-migration.storage_migration:view"
        menu:
          icon: "lucide:hard-drive-download"
          parent: system_mgmt
          sort_order: 60
          title:
            zh-CN: "存储迁移"
            en: "Storage Migration"
    dev:
      entry: "src/index.ts"
    release:
      manifest: "plugin.manifest.json"

dependencies:
  python: []
  plugins: []

pricing:
  type: free
