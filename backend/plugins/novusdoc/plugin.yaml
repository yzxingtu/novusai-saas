name: novusdoc
version: "2.0.0"
display_name:
  zh-CN: "文档管理"
  en: "Document Manager"
description:
  zh-CN: "轻量文档管理插件，支持文件夹、标签、全文搜索和导出。编辑器和 AI 能力由平台提供。"
  en: "Lightweight document management plugin with folders, tags, full-text search and export. Editor and AI powered by platform."
author: "NovusAI"
icon: "lucide:file-text"
scope: admin_and_selected_tenants

capabilities:
  - db:own_tables
  - storage:read
  - storage:write
  - config:write

pricing:
  type: free

config_schema:
  type: object
  required: []
  properties:
    auto_save_interval_ms:
      type: integer
      default: 3000
      minimum: 1000
      maximum: 30000
      title: "Auto-save interval (ms)"
      description: "Auto-save debounce interval in milliseconds"

extensions:
  api:
    tenant_routes:
      - { method: GET,    path: "docs",                handler: "api.documents.list_docs" }
      - { method: POST,   path: "docs",                handler: "api.documents.create_doc" }
      - { method: GET,    path: "docs/{doc_id}",       handler: "api.documents.get_doc" }
      - { method: PUT,    path: "docs/{doc_id}",       handler: "api.documents.update_doc" }
      - { method: DELETE, path: "docs/{doc_id}",       handler: "api.documents.delete_doc" }
      - { method: GET,    path: "folders",              handler: "api.folders.list_folders" }
      - { method: POST,   path: "folders",              handler: "api.folders.create_folder" }
      - { method: PUT,    path: "folders/{folder_id}",  handler: "api.folders.update_folder" }
      - { method: DELETE, path: "folders/{folder_id}",  handler: "api.folders.delete_folder" }
      - { method: GET,    path: "tags",                 handler: "api.tags.list_tags" }
      - { method: POST,   path: "tags",                 handler: "api.tags.create_tag" }
      - { method: DELETE, path: "tags/{tag_id}",        handler: "api.tags.delete_tag" }
      - { method: GET,    path: "search",               handler: "api.search.search_docs" }
      - { method: GET,    path: "docs/{doc_id}/export", handler: "api.export.export_doc" }

    admin_routes:
      - { method: GET,    path: "docs",                handler: "api.documents.list_docs" }
      - { method: POST,   path: "docs",                handler: "api.documents.create_doc" }
      - { method: GET,    path: "docs/{doc_id}",       handler: "api.documents.get_doc" }
      - { method: PUT,    path: "docs/{doc_id}",       handler: "api.documents.update_doc" }
      - { method: DELETE, path: "docs/{doc_id}",       handler: "api.documents.delete_doc" }
      - { method: GET,    path: "folders",              handler: "api.folders.list_folders" }
      - { method: POST,   path: "folders",              handler: "api.folders.create_folder" }
      - { method: PUT,    path: "folders/{folder_id}",  handler: "api.folders.update_folder" }
      - { method: DELETE, path: "folders/{folder_id}",  handler: "api.folders.delete_folder" }
      - { method: GET,    path: "tags",                 handler: "api.tags.list_tags" }
      - { method: POST,   path: "tags",                 handler: "api.tags.create_tag" }
      - { method: DELETE, path: "tags/{tag_id}",        handler: "api.tags.delete_tag" }
      - { method: GET,    path: "search",               handler: "api.search.search_docs" }
      - { method: GET,    path: "docs/{doc_id}/export", handler: "api.export.export_doc" }

  frontend:
    menus:
      - name: novusdoc_tenant
        path: /tenant/plugins/novusdoc
        icon: "lucide:file-text"
        sort_order: 50
        scope: tenant
        title:
          zh-CN: "文档管理"
          en: "Documents"
      - name: novusdoc_admin
        path: /admin/plugins/novusdoc
        icon: "lucide:file-text"
        sort_order: 50
        scope: admin
        title:
          zh-CN: "文档管理"
          en: "Documents"

    standalone_pages:
      - name: novusdoc-tenant
        path: /tenant/plugins/novusdoc
        component: "NovusDocPage"
        icon: "lucide:file-text"
        title:
          zh-CN: "文档管理"
          en: "Documents"
      - name: novusdoc-tenant-editor
        path: /tenant/plugins/novusdoc/editor/:id
        component: "NovusDocEditor"
        icon: "lucide:edit-3"
        title:
          zh-CN: "编辑文档"
          en: "Edit Document"
      - name: novusdoc-admin
        path: /admin/plugins/novusdoc
        component: "NovusDocAdminPage"
        icon: "lucide:file-text"
        title:
          zh-CN: "文档管理"
          en: "Documents"
      - name: novusdoc-admin-editor
        path: /admin/plugins/novusdoc/editor/:id
        component: "NovusDocAdminEditor"
        icon: "lucide:edit-3"
        title:
          zh-CN: "编辑文档"
          en: "Edit Document"
