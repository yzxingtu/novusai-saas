name: novusdoc
version: "2.0.0"
display_name:
  zh-CN: "文档管理"
  en: "Document Manager"
description:
  zh-CN: "轻量文档管理插件，支持文件夹、标签、全文搜索和导出。编辑器和 AI 能力由平台提供。"
  en: "Lightweight document management plugin with folders, tags, full-text search and export. Editor and AI powered by platform."
author: "NovusAI"
icon: ""
scope: admin_and_selected_tenants

capabilities:
  - db:own_tables
  - storage:read
  - storage:write
  - config:write

dependencies:
  python: []
  plugins: []

ai_requirements:
  required_model_types:
    - chat
  min_context_window: 4096
  features: []

features: []

pricing:
  type: free

config_schema:
  type: object
  required: []
  properties:
    auto_save_interval_ms:
      type: integer
      default: 3000
      minimum: 1000
      maximum: 30000
      title: "Auto-save interval (ms)"
      description: "Auto-save debounce interval in milliseconds"

extensions:
  permissions:
    - code: novusdoc_admin
      name:
        zh-CN: "文档管理"
        en: "Document Management"
      scope: admin
      actions: [view, create, update, delete, export]
    - code: novusdoc_portal
      name:
        zh-CN: "文档管理"
        en: "Document Management"
      scope: tenant
      actions: [view, create, update, delete, export]

  api:
    tenant_routes:
      - { method: GET,    path: "docs",                handler: "api.documents.list_docs", permission: "novusdoc_portal:view" }
      - { method: POST,   path: "docs",                handler: "api.documents.create_doc", permission: "novusdoc_portal:create" }
      - { method: GET,    path: "docs/{doc_id}",       handler: "api.documents.get_doc", permission: "novusdoc_portal:view" }
      - { method: PUT,    path: "docs/{doc_id}",       handler: "api.documents.update_doc", permission: "novusdoc_portal:update" }
      - { method: DELETE, path: "docs/{doc_id}",       handler: "api.documents.delete_doc", permission: "novusdoc_portal:delete" }
      - { method: GET,    path: "folders",              handler: "api.folders.list_folders", permission: "novusdoc_portal:view" }
      - { method: POST,   path: "folders",              handler: "api.folders.create_folder", permission: "novusdoc_portal:create" }
      - { method: PUT,    path: "folders/{folder_id}",  handler: "api.folders.update_folder", permission: "novusdoc_portal:update" }
      - { method: DELETE, path: "folders/{folder_id}",  handler: "api.folders.delete_folder", permission: "novusdoc_portal:delete" }
      - { method: GET,    path: "tags",                 handler: "api.tags.list_tags", permission: "novusdoc_portal:view" }
      - { method: POST,   path: "tags",                 handler: "api.tags.create_tag", permission: "novusdoc_portal:create" }
      - { method: DELETE, path: "tags/{tag_id}",        handler: "api.tags.delete_tag", permission: "novusdoc_portal:delete" }
      - { method: GET,    path: "search",               handler: "api.search.search_docs", permission: "novusdoc_portal:view" }
      - { method: GET,    path: "docs/{doc_id}/export", handler: "api.export.export_doc", permission: "novusdoc_portal:export" }

    admin_routes:
      - { method: GET,    path: "docs",                handler: "api.documents.list_docs", permission: "novusdoc_admin:view" }
      - { method: POST,   path: "docs",                handler: "api.documents.create_doc", permission: "novusdoc_admin:create" }
      - { method: GET,    path: "docs/{doc_id}",       handler: "api.documents.get_doc", permission: "novusdoc_admin:view" }
      - { method: PUT,    path: "docs/{doc_id}",       handler: "api.documents.update_doc", permission: "novusdoc_admin:update" }
      - { method: DELETE, path: "docs/{doc_id}",       handler: "api.documents.delete_doc", permission: "novusdoc_admin:delete" }
      - { method: GET,    path: "folders",              handler: "api.folders.list_folders", permission: "novusdoc_admin:view" }
      - { method: POST,   path: "folders",              handler: "api.folders.create_folder", permission: "novusdoc_admin:create" }
      - { method: PUT,    path: "folders/{folder_id}",  handler: "api.folders.update_folder", permission: "novusdoc_admin:update" }
      - { method: DELETE, path: "folders/{folder_id}",  handler: "api.folders.delete_folder", permission: "novusdoc_admin:delete" }
      - { method: GET,    path: "tags",                 handler: "api.tags.list_tags", permission: "novusdoc_admin:view" }
      - { method: POST,   path: "tags",                 handler: "api.tags.create_tag", permission: "novusdoc_admin:create" }
      - { method: DELETE, path: "tags/{tag_id}",        handler: "api.tags.delete_tag", permission: "novusdoc_admin:delete" }
      - { method: GET,    path: "search",               handler: "api.search.search_docs", permission: "novusdoc_admin:view" }
      - { method: GET,    path: "docs/{doc_id}/export", handler: "api.export.export_doc", permission: "novusdoc_admin:export" }

  frontend:
    pages:
      - name: novusdoc-tenant
        path: /tenant/plugins/novusdoc
        component: "NovusDocPage"
        scope: tenant
        icon: "lucide:file-text"
        title:
          zh-CN: "文档管理"
          en: "Documents"
        menu:
          icon: "lucide:file-text"
          sort_order: 50
          title:
            zh-CN: "文档管理"
            en: "Documents"
      - name: novusdoc-tenant-editor
        path: /tenant/plugins/novusdoc/editor/:id
        component: "NovusDocEditor"
        scope: tenant
        icon: "lucide:edit-3"
        title:
          zh-CN: "编辑文档"
          en: "Edit Document"
        access_codes:
          - "plugin.novusdoc.novusdoc_portal:view"
      - name: novusdoc-admin
        path: /admin/plugins/novusdoc
        component: "NovusDocAdminPage"
        scope: admin
        icon: "lucide:file-text"
        title:
          zh-CN: "文档管理"
          en: "Documents"
        menu:
          icon: "lucide:file-text"
          sort_order: 50
          title:
            zh-CN: "文档管理"
            en: "Documents"
      - name: novusdoc-admin-editor
        path: /admin/plugins/novusdoc/editor/:id
        component: "NovusDocAdminEditor"
        scope: admin
        icon: "lucide:edit-3"
        title:
          zh-CN: "编辑文档"
          en: "Edit Document"
        access_codes:
          - "plugin.novusdoc.novusdoc_admin:view"
    dev:
      entry: "src/index.ts"
    release:
      manifest: "plugin.manifest.json"
