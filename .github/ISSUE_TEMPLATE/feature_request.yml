name: "\U0001F680 功能建议"
description: 提出新功能或改进建议
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的功能建议！请描述你的需求场景，帮助我们更好地理解和评估。

  - type: textarea
    id: problem
    attributes:
      label: 问题背景
      description: 你希望解决什么问题？或目前的使用痛点是什么？
      placeholder: "当我 ... 的时候，我希望能够 ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你理想中的解决方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你是否考虑过其他替代方案？

  - type: dropdown
    id: module
    attributes:
      label: 相关模块
      options:
        - 前端 (Frontend)
        - 后端 (Backend)
        - AI 子系统
        - 插件系统
        - 部署/Docker
        - 文档
        - 其他
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 其他上下文或截图（可选）
