name: Build & Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: novusai-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: api
            suffix: ""
          - name: novusai-backend-worker
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: worker
            suffix: ""
          - name: novusai-backend-beat
            context: ./backend
            dockerfile: ./backend/Dockerfile
            target: beat
            suffix: ""
          - name: novusai-frontend-web-antd
            context: .
            dockerfile: frontend/scripts/deploy/Dockerfile
            target: ""
            suffix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_GLOB_API_URL=${{ secrets.VITE_GLOB_API_URL || 'https://api.novusai.example.com' }}
            VITE_PLATFORM_DOMAINS=${{ secrets.VITE_PLATFORM_DOMAINS || 'novusai.example.com' }}
            VITE_APP_STORE_SECURE_KEY=${{ secrets.VITE_APP_STORE_SECURE_KEY || 'ci-placeholder-replace-in-secrets' }}
