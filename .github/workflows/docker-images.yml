name: Docker Images Build and Push

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: novusai-backend
            context: .
            dockerfile: ./backend/Dockerfile
            target: api
          - name: novusai-backend-worker
            context: .
            dockerfile: ./backend/Dockerfile
            target: worker
          - name: novusai-backend-beat
            context: .
            dockerfile: ./backend/Dockerfile
            target: beat
          - name: novusai-frontend-web-antd
            context: .
            dockerfile: frontend/scripts/deploy/Dockerfile
            target: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_GLOB_API_URL=${{ secrets.VITE_GLOB_API_URL || 'https://api.novusai.example.com' }}
            VITE_PLATFORM_DOMAINS=${{ secrets.VITE_PLATFORM_DOMAINS || 'novusai.example.com' }}
            VITE_APP_STORE_SECURE_KEY=${{ secrets.VITE_APP_STORE_SECURE_KEY || 'ci-placeholder-replace-in-secrets' }}

  deploy-railway:
    needs: build-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend-api
            secret: RAILWAY_SERVICE_BACKEND_API
          - name: backend-worker
            secret: RAILWAY_SERVICE_BACKEND_WORKER
          - name: backend-beat
            secret: RAILWAY_SERVICE_BACKEND_BEAT
          - name: frontend
            secret: RAILWAY_SERVICE_FRONTEND
    steps:
      - name: Deploy ${{ matrix.name }} to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
          SERVICE_ID: ${{ secrets[matrix.secret] }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "⚠️  RAILWAY_API_TOKEN not set, skipping Railway deployment"
            exit 0
          fi
          if [ -z "$RAILWAY_ENVIRONMENT_ID" ]; then
            echo "⚠️  RAILWAY_ENVIRONMENT_ID not set, skipping Railway deployment"
            exit 0
          fi
          if [ -z "$SERVICE_ID" ]; then
            echo "⚠️  ${{ matrix.name }}: SERVICE_ID secret not set, skipping"
            exit 0
          fi
          echo "🚀 Triggering Railway redeployment for ${{ matrix.name }} ($SERVICE_ID)"
          PAYLOAD=$(cat <<EOF
          {
            "query": "mutation DeployService(\$environmentId: String!, \$serviceId: String!) { serviceInstanceDeployV2(environmentId: \$environmentId, serviceId: \$serviceId) }",
            "variables": {
              "environmentId": "$RAILWAY_ENVIRONMENT_ID",
              "serviceId": "$SERVICE_ID"
            }
          }
          EOF
          )
          RAW=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          HTTP_STATUS=$(echo "$RAW" | grep "HTTP_STATUS:" | sed 's/.*HTTP_STATUS://')
          RESPONSE=$(echo "$RAW" | sed '/HTTP_STATUS:/d')
          echo "Response: $RESPONSE"
          echo "HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "❌ ${{ matrix.name }}: Railway API returned HTTP $HTTP_STATUS"
            exit 1
          fi
          if echo "$RESPONSE" | grep -q '"errors"'; then
            echo "❌ ${{ matrix.name }}: Railway API returned GraphQL errors"
            exit 1
          fi
          echo "✅ ${{ matrix.name }} deployment triggered"

  release:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史来生成 commit diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenAI SDK
        run: pip install openai

      - name: Generate release notes with AI
        id: notes
        env:
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'gpt-4o-mini' }}
        run: |
          python scripts/generate_release_notes.py \
            --tag "${{ github.ref_name }}" \
            --output /tmp/release_notes.md
          echo "notes_file=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Read version from VERSION file
        id: ver
        run: echo "version=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "v${{ steps.ver.outputs.version }}"
          body_path: ${{ steps.notes.outputs.notes_file }}
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
